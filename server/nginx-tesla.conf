# Add these two blocks inside the HTTPS `server { ... }` for your domain (example.com here).
# Tesla fetches the public key from exactly this path during partner registration and pairing.

    location = /.well-known/appspecific/com.tesla.3p.public-key.pem {
        default_type text/plain;
        alias /etc/nginx/tesla/com.tesla.3p.public-key.pem;
    }

    # OAuth redirect URI: https://example.com/tesla/oauth/callback
    location = /tesla/oauth/callback {
        access_log off;                      # the query string holds the one-time code
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
    }
